name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # если у тебя requirements.txt — оставь так:
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: |
          ruff check .
          ruff format --check .

      # ✅ ДОБАВИЛ: создаём .env, чтобы docker-compose увидел переменные
      - name: Create .env for docker-compose
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=1234
          POSTGRES_DB_AUTH=auth
          POSTGRES_DB_UNIVERSITY=university
          AUTH_SERVICE_INTERNAL_URL=http://auth:8000
          AUTH_SERVICE_API_URL=http://127.0.0.1:8000
          UNIVERSITY_SERVICE_INTERNAL_URL=http://university:8000
          UNIVERSITY_SERVICE_API_URL=http://127.0.0.1:8001
          EOF

      - name: Docker compose up
        run: docker compose up -d

      # ✅ ДОБАВИЛ: ждём, пока сервисы реально начнут принимать запросы
      - name: Wait for services readiness
        run: |
          curl --retry 60 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/docs
          curl --retry 60 --retry-delay 2 --retry-connrefused http://127.0.0.1:8001/docs

      - name: Run tests
        run: |
          pytest -q --alluredir=allure-results

      - name: Docker compose down
        if: always()
        run: docker compose down -v

      # ✅ ДОБАВИЛ: делаем Allure HTML (чтобы можно было задеплоить на Pages)
      - name: Build Allure report
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -fsSL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz
          ./allure-2.27.0/bin/allure generate allure-results -o allure-report --clean

      # ✅ ДОБАВИЛ: упаковываем папку для Pages
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-pages:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' # ✅ ДОБАВИЛ: деплой только из main

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
